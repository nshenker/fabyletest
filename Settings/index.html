<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | Fabyle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: 'rgb(var(--color-primary) / <alpha-value>)', secondary: 'rgb(var(--color-secondary) / <alpha-value>)', surface: 'rgb(var(--color-surface) / <alpha-value>)' }, boxShadow: { 'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)', 'dark-soft': '0 4px 20px -2px rgba(0, 0, 0, 0.4)' } } } }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark');
    </script>
    <style>:root { --color-primary: 242 240 239; --color-secondary: 10 25 47; --color-surface: 255 255 255; } .dark { --color-primary: 10 25 47; --color-secondary: 242 240 239; --color-surface: 16 38 72; }</style>
</head>
<body class="min-h-screen bg-primary font-sans text-secondary overflow-x-hidden transition-colors duration-300 flex flex-col">

    <main class="max-w-[1400px] mx-auto px-4 md:px-6 py-8 md:py-12 w-full flex-grow flex flex-col lg:flex-row gap-8">
        
        <aside class="lg:w-1/4 shrink-0">
            <div class="bg-surface rounded-3xl p-6 border border-secondary/10 shadow-soft dark:shadow-dark-soft sticky top-24">
                <div class="flex items-center space-x-4 mb-8">
                    <div class="w-16 h-16 rounded-full bg-blue-500 text-white flex items-center justify-center text-2xl font-bold shadow-lg">NS</div>
                    <div>
                        <h2 class="text-xl font-bold text-secondary">Nick Shenker</h2>
                        <p class="text-xs font-semibold text-secondary/50 uppercase tracking-widest">Member since 2024</p>
                    </div>
                </div>

                <nav class="flex flex-col space-y-2">
                    <a href="/Profile" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-secondary/5 text-secondary/70 hover:text-secondary font-semibold transition-colors">
                        <span class="flex items-center"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i> Dashboard</span>
                    </a>
                    <a href="/ActiveBids" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-secondary/5 text-secondary/70 hover:text-secondary font-semibold transition-colors">
                        <span class="flex items-center"><i data-lucide="gavel" class="w-5 h-5 mr-3"></i> Active Bids</span>
                    </a>
                    <a href="/Orders" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-secondary/5 text-secondary/70 hover:text-secondary font-semibold transition-colors">
                        <span class="flex items-center"><i data-lucide="shopping-bag" class="w-5 h-5 mr-3"></i> Orders & Wins</span>
                    </a>
                    <a href="/Watchlist" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-secondary/5 text-secondary/70 hover:text-secondary font-semibold transition-colors">
                        <span class="flex items-center"><i data-lucide="heart" class="w-5 h-5 mr-3"></i> Watchlist</span>
                    </a>
                    <div class="h-px bg-secondary/10 my-2"></div>
                    <a href="/Seller" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-secondary/5 text-secondary/70 hover:text-secondary font-semibold transition-colors">
                        <span class="flex items-center"><i data-lucide="store" class="w-5 h-5 mr-3"></i> Seller Dashboard</span>
                    </a>
                    <a href="/Settings" class="flex items-center justify-between px-4 py-3 rounded-xl bg-secondary/5 text-secondary font-bold transition-colors">
                        <span class="flex items-center"><i data-lucide="settings" class="w-5 h-5 mr-3 text-blue-500"></i> Account Settings</span>
                    </a>
                </nav>
            </div>
        </aside>

        <div class="lg:w-3/4 flex flex-col gap-8">
            <div>
                <h2 class="text-3xl font-bold text-secondary mb-2">Account Settings</h2>
                <p class="text-secondary/60 text-sm">Update your personal information and contact details.</p>
            </div>

            <div class="bg-surface rounded-3xl p-8 border border-secondary/10 shadow-soft dark:shadow-dark-soft">
                <h3 class="text-xl font-bold text-secondary mb-6 border-b border-secondary/10 pb-4">Personal Information</h3>
                
                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-2">First Name</label>
                            <input type="text" value="Nick" class="w-full bg-secondary/5 rounded-xl p-3.5 border border-secondary/10 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-surface transition-all text-secondary font-semibold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-2">Last Name</label>
                            <input type="text" value="Shenker" class="w-full bg-secondary/5 rounded-xl p-3.5 border border-secondary/10 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-surface transition-all text-secondary font-semibold">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-2">Email Address</label>
                            <input type="email" value="nick.shenker@example.com" class="w-full bg-secondary/5 rounded-xl p-3.5 border border-secondary/10 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-surface transition-all text-secondary font-semibold">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-secondary/50 uppercase tracking-widest mb-2">Phone Number</label>
                            <input type="tel" value="(555) 123-4567" class="w-full bg-secondary/5 rounded-xl p-3.5 border border-secondary/10 outline-none focus:ring-2 focus:ring-blue-500 focus:bg-surface transition-all text-secondary font-semibold">
                        </div>
                    </div>

                    <div class="pt-6">
                        <button type="button" class="bg-blue-600 text-white font-bold px-8 py-3.5 rounded-xl hover:bg-blue-700 transition-colors shadow-glow-blue border border-blue-500">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="bg-surface rounded-3xl p-8 border border-secondary/10 shadow-soft dark:shadow-dark-soft">
                <h3 class="text-xl font-bold text-secondary mb-6 border-b border-secondary/10 pb-4">Security</h3>
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-bold text-secondary mb-1">Password</div>
                        <div class="text-sm font-semibold text-secondary/60">Last changed 3 months ago</div>
                    </div>
                    <button class="bg-secondary/5 text-secondary border border-secondary/10 hover:bg-secondary/10 px-6 py-2.5 rounded-xl font-bold text-sm transition-colors">
                        Update Password
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
