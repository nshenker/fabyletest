<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Auctions | Fabyle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'rgb(var(--color-primary) / <alpha-value>)',
                        secondary: 'rgb(var(--color-secondary) / <alpha-value>)',
                        surface: 'rgb(var(--color-surface) / <alpha-value>)'
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'hover-up': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
                        'dark-soft': '0 4px 20px -2px rgba(0, 0, 0, 0.4)',
                        'dark-hover-up': '0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5)',
                        'modal': '0 25px 50px -12px rgba(0, 0, 0, 0.25)',
                    }
                }
            }
        }
    </script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        :root { --color-primary: 242 240 239; --color-secondary: 10 25 47; --color-surface: 255 255 255; }
        .dark { --color-primary: 10 25 47; --color-secondary: 242 240 239; --color-surface: 16 38 72; }
    </style>
</head>
<body class="min-h-screen bg-primary font-sans text-secondary transition-colors duration-300">

    <!-- Navigation (Synched) -->
    <nav class="sticky top-0 z-50 flex items-center justify-between px-6 py-4 bg-primary/90 backdrop-blur-md shadow-sm">
        <a href="/" class="font-bold text-3xl tracking-tight">Fabyle</a>
        <div class="flex items-center space-x-6 text-sm font-semibold">
            <a href="/UpcomingAuctions" class="text-secondary font-bold">Auctions</a>
            <a href="/Shop" class="text-secondary/60 hover:text-secondary">Shop</a>
        </div>
    </nav>

    <main class="max-w-[1400px] mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold mb-12">Upcoming Auctions</h1>

        <!-- Hero Auction -->
        <div class="bg-surface rounded-3xl p-8 border border-secondary/10 shadow-soft mb-12">
            <h2 class="text-2xl font-bold mb-4">Spring Fine Art Showcase</h2>
            <button onclick="openRegisterModal()" class="bg-secondary text-primary px-8 py-4 rounded-xl font-bold hover:bg-secondary/90 transition-all">
                Register to Bid
            </button>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="bg-surface p-6 rounded-2xl border border-secondary/10 shadow-soft">
                <h3 class="text-xl font-bold mb-4">Trading Cards Event</h3>
                <button onclick="openRegisterModal()" class="w-full bg-secondary text-primary font-bold py-3 rounded-xl hover:bg-secondary/90 transition-all">Register</button>
            </div>
        </div>
    </main>

    <!-- Registration Modal Overlay -->
    <div id="register-modal" class="fixed inset-0 z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 px-4">
        <div class="absolute inset-0 bg-secondary/80 backdrop-blur-sm" onclick="closeRegisterModal()"></div>
        
        <div class="bg-primary w-full max-w-lg rounded-3xl shadow-modal relative p-8 transform scale-95 transition-transform duration-300" id="register-modal-content">
            <button onclick="closeRegisterModal()" class="absolute top-4 right-4 text-secondary/60 hover:text-secondary"><i data-lucide="x"></i></button>
            
            <h2 class="text-2xl font-bold mb-2">Register for Auction</h2>
            <p class="text-secondary/60 mb-6 text-sm">Please confirm your details to participate.</p>
            
            <form class="space-y-4">
                <input type="text" placeholder="First Name" class="w-full bg-surface p-3 rounded-xl border border-secondary/10 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" placeholder="Last Name" class="w-full bg-surface p-3 rounded-xl border border-secondary/10 outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" placeholder="Email Address" class="w-full bg-surface p-3 rounded-xl border border-secondary/10 outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="w-full bg-secondary text-primary font-bold py-4 rounded-xl mt-4 hover:bg-secondary/90">Complete Registration</button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        const modal = document.getElementById('register-modal');
        const modalContent = document.getElementById('register-modal-content');

        function openRegisterModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
        }

        function closeRegisterModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
        }
    </script>
</body>
</html>
